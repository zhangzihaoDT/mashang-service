name: Market Monitor GHCR

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bootstrap package access or publish an application image
        type: choice
        options: [bootstrap, release]
        required: true
        default: bootstrap
      version:
        description: Immutable application tag (release only)
        type: string
        default: '0.1.0'
      access_reviewed:
        description: Package access was verified and public repository permission inheritance is off
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: market-monitor-ghcr
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zhangzihaoDT/mashang-service' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/zhangzihaodt/mashang-market-monitor
      SOURCE: https://github.com/zhangzihaoDT/mashang-service
      TARGET_PLATFORM: linux/amd64
      PACKAGE_API: https://api.github.com/users/zhangzihaoDT/packages/container/mashang-market-monitor
      OPERATION: ${{ inputs.operation }}
      IMAGE_VERSION: ${{ inputs.version }}
      ACCESS_REVIEWED: ${{ inputs.access_reviewed }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify package visibility and tag availability
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == bootstrap ]]; then
            tag=access-bootstrap
          else
            [[ "$OPERATION" == release && "$ACCESS_REVIEWED" == true ]]
            [[ "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag="$IMAGE_VERSION"
          fi

          data="$(mktemp)"
          trap 'rm -f "$data"' EXIT
          status="$(printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -sS --retry 2 \
            -H @- -H 'Accept: application/vnd.github+json' -o "$data" -w '%{http_code}' "$PACKAGE_API")"
          case "$status" in
            200)
              jq -e '.visibility == "private"' "$data" >/dev/null
              tags="$(gh api --paginate "${PACKAGE_API#https://api.github.com/}/versions" \
                --jq '.[].metadata.container.tags[]?')"
              if grep -Fxq -- "$tag" <<< "$tags"; then
                echo "::error::Tag $tag already exists. Release tags are immutable."
                exit 1
              fi
              ;;
            404)
              if [[ "$OPERATION" != bootstrap ]]; then
                echo "::error::Bootstrap the private package and verify its access before publishing an application image."
                exit 1
              fi
              ;;
            *)
              echo "::error::Could not verify GHCR package visibility (HTTP $status)."
              exit 1
              ;;
          esac
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Build the image
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          context=apps/market_monitor
          dockerfile="$context/deploy/Dockerfile"
          if [[ "$OPERATION" == bootstrap ]]; then
            context="$(mktemp -d)"
            dockerfile="$context/Dockerfile"
            printf '%s\n' 'FROM scratch' 'COPY marker /market-monitor-ghcr-bootstrap' > "$dockerfile"
            printf '%s\n' 'GHCR access check only' > "$context/marker"
          fi
          docker buildx build --platform "$TARGET_PLATFORM" --load \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            --tag "$IMAGE:$TAG" --file "$dockerfile" "$context"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG")" == "$TARGET_PLATFORM" ]]

      - name: Verify the application image contains only expected app files
        if: inputs.operation == 'release'
        env:
          TAG: ${{ steps.guard.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network none --entrypoint python "$IMAGE:$TAG" - <<'PY'
          from pathlib import Path
          root = Path("/opt/market-monitor")
          app = "apps/market_monitor/"
          allowed = {
              app + "backend/" + name for name in ("__main__.py", "snapshot.py", "web.py")
          } | {
              app + "configs/sources.json", app + "frontend/index.html",
              app + "frontend/app.js", app + "frontend/app.css",
          }
          actual = {str(path.relative_to(root)) for path in root.rglob("*") if path.is_file()}
          assert actual == allowed, "Unexpected files in application image"
          assert not any(path.is_symlink() for path in root.rglob("*")), "Unexpected symbolic link"
          PY

      - name: Publish, then verify private access and the registry digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.guard.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          helper_dir="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG" "$helper_dir"' EXIT
          printf '%s\n' '{"credHelpers":{"ghcr.io":"market-monitor-ghcr"}}' > "$DOCKER_CONFIG/config.json"
          cat > "$helper_dir/docker-credential-market-monitor-ghcr" <<'SH'
          #!/bin/bash
          set -euo pipefail
          [[ "$1" == get ]]
          server="$(cat)"
          [[ "$server" == ghcr.io || "$server" == https://ghcr.io ]]
          jq -nc --arg server "$server" '{ServerURL:$server, Username:env.GITHUB_ACTOR, Secret:env.GH_TOKEN}'
          SH
          chmod 700 "$helper_dir/docker-credential-market-monitor-ghcr"
          export PATH="$helper_dir:$PATH"

          push_log="$(docker push "$IMAGE:$TAG")"
          printf '%s\n' "$push_log"
          digest="$(awk '/digest: sha256:/ {for (i=1; i<NF; i++) if ($i=="digest:") print $(i+1)}' <<< "$push_log")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          digest_ref="$IMAGE@$digest"
          docker pull --platform "$TARGET_PLATFORM" "$digest_ref"
          [[ "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$digest_ref")" == "$TARGET_PLATFORM" ]]

          gh api "${PACKAGE_API#https://api.github.com/}" --jq .visibility | grep -Fx private
          anonymous_response="$(curl -sS --retry 2 -w $'\n%{http_code}' --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${IMAGE#ghcr.io/}:pull" https://ghcr.io/token)"
          anonymous="${anonymous_response##*$'\n'}"
          if [[ "$anonymous" == 200 ]]; then
            anonymous_token="$(jq -er '.token // .access_token' <<< "${anonymous_response%$'\n'*}")"
            anonymous="$(printf 'Authorization: Bearer %s\n' "$anonymous_token" | curl -sS --retry 2 \
              -H @- -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              -o /dev/null -w '%{http_code}' "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$TAG")"
          fi
          unset anonymous_response anonymous_token
          case "$anonymous" in
            401|403) ;;
            *) echo "::error::Expected anonymous pulls to be denied; received HTTP $anonymous."; exit 1 ;;
          esac
          printf '### GHCR publication\n\n- Tag: `%s:%s`\n- Digest: `%s`\n- Platform: `%s`\n- Package: private; anonymous pull denied.\n' \
            "$IMAGE" "$TAG" "$digest_ref" "$TARGET_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
