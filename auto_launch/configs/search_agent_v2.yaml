# search_agent_v2.yaml — Auto Launch Agent 搜索闭环配置 v2.2
#
# 核心变化：
#   1. 停止由证据驱动，不由模板数量决定
#   2. Query 生成由信息缺口驱动，不由固定 stage 决定
#   3. Profile 控制最大资源边界 + 停止阈值（stop_thresholds）
#   4. match_keywords 字段覆盖检测 + publication_tier_map 信源类型映射
#   5. 搜索查询自带 douyin/bilibili 等平台关键词
#
# 环境变量（复用 V1）:
#   VOLC_SEARCH_BASE_URL
#   DOUBAO_SEARCH_GLOBAL_API_KEY

api:
  base_url_env: VOLC_SEARCH_BASE_URL
  api_key_env: DOUBAO_SEARCH_GLOBAL_API_KEY
  timeout_seconds: 30
  max_retries: 3
  retry_delay_seconds: 2

defaults:
  language: zh-CN
  time_range_boost: true

# ── Profile ─────────────────────────────────────────────
# 三个等级，控制的是最大资源边界和可接受证据等级，不是 Query 数量
query_profiles:
  lite_scan:
    max_rounds: 1
    max_queries: 3
    max_provider_calls: 5
    acceptable_evidence: confirmed
    use_case: daily_watch_quick_check
    stop_thresholds:
      confirmed:
        min_independent_sources: 2
        min_official_sources: 1
        required_fields_coverage: 0.8
      fallback:
        min_independent_sources: 3
        min_source_tier_types: 2
        max_shared_origin_ratio: 0.5
        required_fields_coverage: 0.7

  standard_scan:
    max_rounds: 2
    max_queries: 6
    max_provider_calls: 8
    acceptable_evidence: [confirmed, probable]
    use_case: user_open_scan
    stop_thresholds:
      confirmed:
        min_independent_sources: 3
        min_official_sources: 1
        required_fields_coverage: 0.8
      fallback:
        min_independent_sources: 5
        min_source_tier_types: 2
        max_shared_origin_ratio: 0.5
        required_fields_coverage: 0.7

  deep_scan:
    max_rounds: 3
    max_queries: 10
    max_provider_calls: 15
    acceptable_evidence: [confirmed, probable]
    use_case: event_deep_dive
    stop_thresholds:
      confirmed:
        min_independent_sources: 5
        min_official_sources: 2
        required_fields_coverage: 0.9
      fallback:
        min_independent_sources: 8
        min_source_tier_types: 3
        max_shared_origin_ratio: 0.4
        required_fields_coverage: 0.8

# ── 停止策略 ────────────────────────────────────────────
search_stop_policy:
  # 条件决策表：按顺序评估，满足即停止
  decision_table:
    - condition: confirmed
      conclusion_status: confirmed
      stop_reason: evidence_sufficient

    - condition: fallback
      conclusion_status: probable
      stop_reason: fallback_acceptable

    - condition: hard_limit
      conclusion_status: insufficient_evidence
      stop_reason: hard_limit_reached

    - condition: weak_signal
      conclusion_status: weak_signal
      stop_reason: evidence_below_threshold

  conditions:
    confirmed:
      min_independent_sources: 2
      min_official_sources: 1
      required_fields_coverage: 0.8
      unresolved_high_risk_claims: 0

    fallback:
      min_independent_sources: 3
      min_source_tier_types: 2
      max_shared_origin_ratio: 0.5
      allowed_source_tiers:
        - media
        - dealer
        - social
      required_fields_coverage: 0.7
      unresolved_high_risk_claims: 0

    hard_limit: {}
    weak_signal: {}

  hard_limits:
    max_rounds: 3
    max_queries: 10
    max_provider_calls: 15

# ── 高风险 Claim 定义 ───────────────────────────────────
high_risk_claims:
  - price_change            # 价格变动
  - sales_volume            # 销量数据
  - launch_status           # 上市状态
  - partnership             # 合作关系
  - liability               # 事故责任
  - recall                  # 召回
  - range_mileage           # 续航里程
  - safety_rating           # 安全评级

# ── 字段体系（三层结构: identity / metadata / evidence）───
# identity: 识别目标身份（品牌/车型）
# metadata: 事件基本信息（时间/类型/来源）
# evidence: 实际发现的关键事实（核心结论）
field_definitions:
  brand_watch:
    identity:
      - field: brand
        label: 品牌名称
        weight: 1.0
        match_keywords: []
    metadata:
      - field: event_date
        label: 事件日期
        weight: 0.8
        match_keywords: ["日期", "时间", "今天", "昨天", "月", "日", "年"]
      - field: event_type
        label: 事件类型
        weight: 0.7
        match_keywords: ["发布", "预售", "上市", "交付", "活动", "发布会", "亮相", "首秀"]
      - field: source
        label: 信息来源
        weight: 0.6
        match_keywords: ["来源", "报道", "发布"]
    evidence:
      - field: key_fact
        label: 关键事实
        weight: 1.0
        match_keywords: ["发布", "预售", "上市", "售罄", "交付", "首发", "公布", "宣布", "开启", "推出"]
    optional:
      - field: official_confirmation
        label: 官方确认
        weight: 0.5
        match_keywords: ["官方", "公告", "回应", "声明", "官宣"]
      - field: sales_status
        label: 销售状态
        weight: 0.4
        match_keywords: ["销量", "战报", "订单", "交付", "开售", "售罄"]

  model_watch:
    identity:
      - field: brand
        label: 品牌名称
        weight: 1.0
        match_keywords: []
      - field: model
        label: 车型名称
        weight: 1.0
        match_keywords: []
    metadata:
      - field: event_date
        label: 事件日期
        weight: 0.8
        match_keywords: ["日期", "时间", "今天", "昨天", "月", "日", "年"]
      - field: event_type
        label: 事件类型
        weight: 0.7
        match_keywords: ["发布", "预售", "上市", "交付", "活动", "发布会", "亮相", "首秀"]
      - field: source
        label: 信息来源
        weight: 0.6
        match_keywords: ["来源", "报道", "发布"]
    evidence:
      - field: key_fact
        label: 关键事实
        weight: 1.0
        match_keywords: ["发布", "预售", "上市", "售罄", "交付", "首发", "公布", "宣布", "开启", "推出"]
    optional:
      - field: price_change
        label: 价格变化
        weight: 0.5
        match_keywords: ["价格", "售价", "涨价", "降价", "调价", "预售", "万"]
      - field: official_confirmation
        label: 官方确认
        weight: 0.5
        match_keywords: ["官方", "公告", "回应", "声明", "官宣"]
      - field: benefit_adjustment
        label: 权益调整
        weight: 0.5
        match_keywords: ["权益", "优惠", "补贴", "金融", "置换"]

  buzz_watch:
    identity:
      - field: brand
        label: 品牌名称
        weight: 1.0
        match_keywords: []
      - field: model
        label: 车型名称
        weight: 1.0
        match_keywords: []
    metadata:
      - field: source
        label: 信息来源
        weight: 0.6
        match_keywords: ["来源", "报道", "发布"]
    evidence:
      - field: buzz_volume
        label: 声量信号
        weight: 1.0
        match_keywords: ["热度", "声量", "爆火", "刷屏", "热议", "关注度", "火", "疯", "抢空", "卖光"]
      - field: key_fact
        label: 关键事实
        weight: 0.8
        match_keywords: ["发布", "预售", "上市", "售罄", "交付", "首发", "公布", "宣布", "开启", "推出"]
      - field: wechat_mention
        label: 微信提及
        weight: 0.4
        match_keywords: ["微信", "公众号", "文章"]
      - field: wechat_value
        label: 微信指数值
        weight: 0.7
        match_keywords: ["微信指数", "指数", "排行榜"]
      - field: social_discussion
        label: 社交讨论
        weight: 0.6
        match_keywords: ["小红书", "微博", "抖音", "bilibili", "B站", "讨论", "话题", "社交"]
      - field: sentiment
        label: 情感倾向
        weight: 0.4
        match_keywords: ["口碑", "评价", "投诉", "好评", "差评", "满意度", "骂", "赞", "争议"]
    optional: []

# ── 初始 Query 模板（缺口驱动改写用）────────────────────
# 仅用于第 1 轮初始搜索。后续轮次由 gap_analyzer + query_rewriter 生成。
initial_queries:
  brand_watch:
    - pattern: "{brand} 最近{days}天 官方 动作 交付 权益 OTA"
      purpose: overview_discovery
      source_tier_focus: [tier_1_official, tier_3_industry_media]
    - pattern: "{brand} 交付 销量 战报 最近{days}天"
      purpose: sales_milestone_check
      source_tier_focus: [tier_1_official, tier_3_industry_media]
    - pattern: "{brand} 权益 价格 限时 最近{days}天"
      purpose: benefit_price_check
      source_tier_focus: [tier_1_official, tier_3_industry_media]

  model_watch:
    - pattern: "{target} 上市 发布 交付 最近{days}天"
      purpose: lifecycle_status
      source_tier_focus: [tier_1_official, tier_3_industry_media]
    - pattern: "{target} 权益 价格 配置 最近{days}天"
      purpose: product_config_check
      source_tier_focus: [tier_1_official, tier_3_industry_media]
    - pattern: "{target} 评测 试驾 口碑 最近{days}天"
      purpose: public_reaction
      source_tier_focus: [tier_3_industry_media, tier_4_social_signal]

  buzz_watch:
    - pattern: "{target} 微信指数 最近{days}天"
      purpose: wechat_index_check
      source_tier_focus: [tier_3_industry_media, tier_4_social_signal]
    - pattern: "{target} 声量 热度 讨论 最近{days}天"
      purpose: social_buzz_check
      source_tier_focus: [tier_3_industry_media, tier_4_social_signal]
    - pattern: "{target} 关注度 搜索指数 抖音 bilibili 话题 最近{days}天"
      purpose: attention_index_check
      source_tier_focus: [tier_3_industry_media, tier_4_social_signal]

# ── Gap → Query 改写规则 ────────────────────────────────
# missing_field → 推荐改写方向
gap_query_rules:
  event_date:
    - pattern: "{target} {event_type} 时间 日期"
      purpose: 补充事件时间
  official_confirmation:
    - pattern: "{target} 官方 回应 公告"
      purpose: 查找官方确认
    - pattern: "{target} 官方发布 {event_type}"
      purpose: 官方发布确认
  sales_status:
    - pattern: "{target} 销售 开售 到店 下单"
      purpose: 查找销售状态
    - pattern: "{target} 交付 开启 提车"
      purpose: 查找交付状态
  price_change:
    - pattern: "{target} 价格 降价 涨价 调价"
      purpose: 查找价格变化
    - pattern: "{target} 售价 官方指导价 调整"
      purpose: 查找官方价格
  benefit_adjustment:
    - pattern: "{target} 权益 优惠 补贴 金融"
      purpose: 查找权益调整
    - pattern: "{target} 限时 权益 政策"
      purpose: 查找限时权益
  dealer_info:
    - pattern: "{target} 经销商 到店 优惠"
      purpose: 查找经销商信息
    - pattern: "{target} 门店 试驾 体验"
      purpose: 查找门店动态
  partnership:
    - pattern: "{target} 合作 联名 签约"
      purpose: 查找合作关系
  launch_status:
    - pattern: "{target} 上市 发布 发布会"
      purpose: 查找上市状态
  safety_rating:
    - pattern: "{target} 安全 碰撞 评级 测试"
      purpose: 查找安全评价
  buzz_volume:
    - pattern: "{target} 声量 热度 讨论度 最近{days}天"
      purpose: 查找声量热度
    - pattern: "{target} 关注度 搜索指数 百度指数 最近{days}天"
      purpose: 查找搜索指数
  wechat_mention:
    - pattern: "{target} 微信公众号 文章 最近{days}天"
      purpose: 查找微信提及
    - pattern: "{target} 微信 讨论 最近{days}天"
      purpose: 查找微信讨论
  wechat_value:
    - pattern: "{target} 微信指数 最近{days}天"
      purpose: 查找微信指数值
    - pattern: "{target} 微信指数 数据 最近{days}天"
      purpose: 查找微信指数数据
  social_discussion:
    - pattern: "{target} 小红书 微博 讨论 最近{days}天"
      purpose: 查找社交讨论
    - pattern: "{target} 抖音 bilibili 话题 播放 最近{days}天"
      purpose: 查找短视频热度
  sentiment:
    - pattern: "{target} 口碑 评价 满意度 最近{days}天"
      purpose: 查找口碑情感

# ── 信源分级 ────────────────────────────────────────────
source_tiers:
  tier_1_official:
    label: 官方源
    weight: 1.0
    domains: []
  tier_2_authoritative_media:
    label: 权威媒体
    weight: 0.8
    domains: []
  tier_3_industry_media:
    label: 行业媒体
    weight: 0.6
    domains: []
  tier_4_social_signal:
    label: 社交信号
    weight: 0.4
    domains: []
  tier_5_unverified:
    label: 未验证源
    weight: 0.2
    domains: []

# ── 出版物 → 信源类型映射 ──────────────────────────────
# 搜索 API 返回中文出版物名称（非 URL），
