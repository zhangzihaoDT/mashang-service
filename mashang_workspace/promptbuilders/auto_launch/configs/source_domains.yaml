# 域名/信源分类配置
# version: v0.2
# 用于 source_domain_resolver 判断 source_type / source_tier
#
# 设计原则：
# 1. official_domains 按“品牌 key”展开，便于在品牌级每日营销事件监控中做归因。
# 2. HIMA / 蔚来系 / 比亚迪系 / 吉利系 / 广汽系保留集团或生态域名，但子品牌也单独列出。
# 3. 同一官方域名可能服务多个子品牌，例如 hima.auto；最终品牌归因仍建议结合 brand/model keywords。
# 4. 域名只写 host，不写 path；path 级品牌差异交给 query_builder / result_normalizer 结合关键词判断。

