# Volc Search API 配置 v0.2
# 环境变量: VOLC_SEARCH_BASE_URL, DOUBAO_SEARCH_GLOBAL_API_KEY

api:
  base_url_env: VOLC_SEARCH_BASE_URL
  api_key_env: DOUBAO_SEARCH_GLOBAL_API_KEY
  timeout_seconds: 30
  max_retries: 3
  retry_delay_seconds: 2

defaults:
  language: zh-CN
  time_range_boost: true

query_profiles:
  lite_scan:
    query_budget_per_target: 3
    result_limit_per_query: 5
    allow_refine: false
    use_case: daily_watch

  balanced:
    query_budget_per_target: 5
    result_limit_per_query: 8
    allow_refine: true
    scout_query_count: 3
    refine_query_budget: 2
    use_case: owned_brand_daily_watch

  standard_scan:
    query_budget_per_target: 5
    result_limit_per_query: 8
    allow_refine: true
    scout_query_count: 3
    refine_query_budget: 2
    use_case: user_open_scan

  deep_scan:
    query_budget_per_target: 8
    result_limit_per_query: 10
    allow_refine: true
    scout_query_count: 3
    refine_query_budget: 5
    use_case: event_deep_dive
    total_queries: 8

cache:
  enabled: true
  root_dir: outputs/auto_launch/search_cache
  ttl_hours: 24
  key_fields:
    - provider
    - query
    - start_date
    - end_date
    - result_limit
    - mode
    - target_id

search_templates:
  brand_scout:
    - pattern: "{brand} 最近{days}天 官方 动作 交付 权益 OTA"
      event_focus: []
      stage: scout
      query_role: overview_discovery
    - pattern: "{brand} 交付 销量 战报 最近{days}天"
      event_focus: ["delivery_start", "sales_milestone", "order_milestone"]
      stage: scout
      query_role: specific_discovery
    - pattern: "{brand} 权益 价格 限时 最近{days}天"
      event_focus: ["benefit_adjustment", "official_price_change"]
      stage: scout
      query_role: specific_discovery

  brand_refine:
    - pattern: "{brand} OTA 技术 发布 最近{days}天"
      event_focus: ["technology_release", "config_release", "launch_event"]
      stage: refine
      query_role: specific_discovery
    - pattern: "{brand} 门店 试驾 活动 最近{days}天"
      event_focus: ["channel_campaign", "user_event"]
      stage: refine
      query_role: specific_discovery

  brand_deep:
    - pattern: "{brand} 发布会 技术 品牌 最近{days}天"
      event_focus: ["launch_event", "technology_release", "brand_campaign"]
      stage: refine
      query_role: specific_discovery
    - pattern: "{brand} 联名 合作 代言 最近{days}天"
      event_focus: ["partnership"]
      stage: refine
      query_role: specific_discovery
    - pattern: "{brand} 高管 直播 最近{days}天"
      event_focus: ["executive_voice"]
      stage: refine
      query_role: specific_discovery
    - pattern: "{brand} 爆料 疑似 最近{days}天"
      event_focus: ["rumor_or_leak"]
      stage: refine
      query_role: specific_discovery

  event_specific:
    - pattern: "{target} 上市 发布会 最近{days}天"
      event_focus: ["launch", "launch_event"]
    - pattern: "{target} 预售 盲订 最近{days}天"
      event_focus: ["presale"]
    - pattern: "{target} 降价 售价 价格调整 最近{days}天"
      event_focus: ["official_price_change"]
    - pattern: "{target} 权益 补贴 金融 最近{days}天"
      event_focus: ["benefit_adjustment"]
    - pattern: "{target} 交付 提车 最近{days}天"
      event_focus: ["delivery_start"]
    - pattern: "{target} 销量 订单 战报 最近{days}天"
      event_focus: ["order_milestone", "sales_milestone"]
    - pattern: "{target} 爆料 路透 经销商 最近{days}天"
      event_focus: ["rumor_or_leak"]

  intent_mappings:
    price_rights:
      - pattern: "{brand} 权益 价格 限时 最近{days}天"
      - pattern: "{brand} 官方 权益 限时 价格 最近{days}天"
      - pattern: "{brand} 经销商 优惠 到店 最近{days}天"
    sales_delivery:
      - pattern: "{brand} 交付 销量 战报 最近{days}天"
      - pattern: "{brand} 官方 交付量 月度 销量 最近{days}天"
      - pattern: "{brand} 上半年 交付 同比 最近{days}天"
    dealer_rumor:
      - pattern: "{brand} 销售 朋友圈 权益 最近{days}天"
      - pattern: "{brand} 经销商 优惠 到店 最近{days}天"
      - pattern: "{brand} 小红书 销售 顾问 最近{days}天"
      - pattern: "{brand} 爆料 疑似 最近{days}天"
    official_only:
      - pattern: "{brand} 官方 最近{days}天 公告 权益 交付"
