    priority: 100
    question: 差异来自哪些子指数？
    reason: 决定 Topic 是否存在体验结构，而不是整体平移。
    action: compare --group YPV_01 --metrics AEXT_Index AINT_Index AFUEL_Index ADRV_Index ASFTY_Index
